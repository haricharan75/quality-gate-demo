name: Advanced Quality Gate

on:
  pull_request:
    branches: [ "main" ] # The gate now ONLY runs on Pull Requests

jobs:
  inspect-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out the code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install advanced inspection tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov bandit
        
    - name: Gate Rule 1 - Code Formatting
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Gate Rule 2 - Unit Tests & Coverage
      # Fails if tests fail OR if test coverage is below 80%
      run: pytest --cov=./ --cov-fail-under=80
      
    - name: Gate Rule 3 - Security Vulnerability Scan
      # Scans the Python code for common security flaws
      run: bandit -r .
